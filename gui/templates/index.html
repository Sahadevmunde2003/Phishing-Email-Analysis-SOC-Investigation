<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phishing Email Analyzer</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><h1>Phishing Email Analyzer</h1><p>Offline SOC investigation dashboard</p></header>
<section class="upload"><h2>Analyze an Email</h2><p>Upload an <code>.eml</code> file or paste the raw email.</p><input id="file" type="file" accept=".eml"><button onclick="analyze()">Analyze Uploaded Email</button><hr><textarea id="rawEmail" rows="14" placeholder="Paste complete raw email including headers..."></textarea><br><br><button onclick="analyzeRaw()">Analyze Pasted Email</button><button onclick="reportRaw()">Export HTML Report</button></section>
<div id="status"></div><section id="dashboard" class="hidden"><div class="metrics"><div><span>Risk Score</span><strong id="score"></strong></div><div><span>Severity</span><strong id="severity"></strong></div><div><span>URLs</span><strong id="urlCount"></strong></div><div><span>Attachments</span><strong id="attCount"></strong></div></div><div class="grid"><article><h2>Email</h2><p><b>Subject:</b> <span id="subject"></span></p><p><b>From:</b> <span id="from"></span></p><p><b>Reply-To:</b> <span id="reply"></span></p></article><article><h2>Findings</h2><div id="findings"></div></article><article><h2>IOCs</h2><div id="iocs"></div></article><article><h2>MITRE ATT&CK</h2><div id="mitre"></div></article></div><article><h2>Recommendations</h2><ol id="recommendations"></ol></article></section></main><script src="/static/app.js"></script></body></html>
